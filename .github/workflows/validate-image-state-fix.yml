name: Validate image state consistency fix

on:
  push:
    branches:
      - fix-image-state-consistency
    paths:
      - scripts/fix_image_state_consistency.py
      - .github/workflows/validate-image-state-fix.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix-image-state-consistency
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply image state fix
        run: python3 scripts/fix_image_state_consistency.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Remove temporary files
        run: |
          rm -f scripts/fix_image_state_consistency.py
          rm -f .github/workflows/validate-image-state-fix.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Harden generated image state consistency"
          git push origin fix-image-state-consistency
