name: Apply validated bot refactor

on:
  push:
    branches:
      - bot-logic-refactor
    paths:
      - scripts/refactor_bot.py
      - .github/workflows/apply-bot-refactor.yml

permissions:
  contents: write

jobs:
  refactor-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: bot-logic-refactor
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply refactor
        run: python3 scripts/refactor_bot.py

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Remove temporary helper files
        run: |
          rm -f app/api/telegram/route.ts.before-logic-refactor
          rm -f scripts/refactor_bot.py
          rm -f .github/workflows/apply-bot-refactor.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refactor Telegram bot logic and response pipeline"
          git push origin bot-logic-refactor
